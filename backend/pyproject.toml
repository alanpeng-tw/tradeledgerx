[tool.poetry]
name = "tradeledgerx-backend"
version = "0.1.0"
description = "Backend for TradeLedgerX"
authors = ["Alanpeng <alanpeng@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
beanie = "^1.26.0"
motor = "^3.5.0"
pydantic-settings = "^2.4.0"
pyjwt = "^2.9.0"
redis = "^5.0.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = ">=4.0.1,<4.1"  # passlib 1.7.4 與 bcrypt 4.1+ 不相容 (缺少 __about__)
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
